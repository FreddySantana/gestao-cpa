<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicação · Portal CPA</title>
  <link rel="stylesheet" href="/css/portal.css">
  <link rel="preconnect" href="https://nzsjbakghksbuvammgtp.supabase.co" crossorigin>
  <link rel="modulepreload" href="/js/config.js">
  <link rel="modulepreload" href="/js/vendor/supabase-bundle.mjs">
  <link rel="modulepreload" href="/js/db.js">
  <link rel="modulepreload" href="/js/comum.js">
  <script>
    // Aplica a marca do campus (descoberta pelo domínio) antes da primeira pintura.
    // O título aqui é provisório: vira o da notícia assim que ela carrega.
    (function (secao) {
      try {
        var mapa = { 'para.cpaestacio.com.br': 'para', 'belem.cpaestacio.com.br': 'belem' };
        var forcado = new URLSearchParams(location.search).get('campus');
        if (forcado === 'para' || forcado === 'belem') sessionStorage.setItem('campus-forcado', forcado);
        var campus = sessionStorage.getItem('campus-forcado') || mapa[location.hostname] || 'para';
        var nomes = {
          para: ['Portal CPA · Estácio Pará', 'Comissão Própria de Avaliação · Estácio Pará', 'CPA · Estácio Pará'],
          belem: ['Portal CPA · Estácio Belém', 'Comissão Própria de Avaliação · Centro Universitário Estácio Belém', 'CPA · Estácio Belém'],
        }[campus];
        document.documentElement.dataset.campus = campus;
        window.__CPA_SUB = nomes[1];
        window.__CPA_CURTO = nomes[2];
        window.__CPA_PORTAL = nomes[0];
        document.title = secao ? secao + ' · ' + nomes[0] : nomes[0];
      } catch (e) {}
    })('Publicação');
  </script>
</head>
<body>
  <header class="topo">
    <div class="container topo-inner">
      <a class="marca" href="/">
        <span class="logo">CPA</span>
        <span class="marca-nome" data-config="subtitulo">Comissão Própria de Avaliação<small>Estácio</small></span>
        <span class="marca-nome-curto">CPA · Estácio</span>
      </a>
      <nav class="menu">
        <a href="/">Início</a>
        <a href="/noticias.html" class="ativo">Notícias</a>
        <a href="/documentos.html">Documentos</a>
        <a href="/quem-somos.html">Quem Somos</a>
        <a id="menu-pesquisa" class="btn-pesquisa" href="#" target="_blank" rel="noopener" style="display:none">Responder Pesquisa</a>
      </nav>
      <div class="menu-mobile">
        <select onchange="if(this.value)location.href=this.value">
          <option value="">Menu</option>
          <option value="/">Início</option>
          <option value="/noticias.html">Notícias</option>
          <option value="/documentos.html">Documentos</option>
          <option value="/quem-somos.html">Quem Somos</option>
        </select>
      </div>
    </div>
  </header>
  <script>if (window.__CPA_SUB) { document.querySelector('.marca-nome').textContent = window.__CPA_SUB; document.querySelector('.marca-nome-curto').textContent = window.__CPA_CURTO; }</script>

  <div class="container">
    <article class="artigo" id="artigo">
      <div class="sk-titulo skeleton"></div>
      <div class="sk-linha skeleton" style="width:40%"></div>
      <div class="skeleton" style="height:260px;margin:20px 0"></div>
      <div class="sk-linha skeleton"></div>
      <div class="sk-linha skeleton" style="width:85%"></div>
      <div class="sk-linha skeleton" style="width:70%"></div>
    </article>

    <section class="secao" id="sec-relacionadas" style="display:none">
      <div class="secao-cabeca"><h2>Publicações relacionadas</h2></div>
      <div class="grade" id="relacionadas"></div>
    </section>
  </div>

  <footer class="rodape">
    <div class="container">
      <span data-config="nome_portal">Portal CPA · Estácio</span>
      <a href="/quem-somos.html">Quem Somos</a>
      <a href="/documentos.html">Documentos</a>
      <a class="admin-link" href="/admin.html">Área administrativa</a>
    </div>
  </footer>

  <script type="module">
    import { sb, SEL_PUB, normalizaPublicacao, urlArquivo, pegaConfig, comCache, exigeDados, CAMPUS_VISIVEIS } from '/js/db.js';
    import { aplicaConfig, cardPublicacao, mdParaHtml, esc, fmtData, fmtTamanho, classeIcone } from '/js/comum.js';

    comCache('config', pegaConfig, aplicaConfig);

    const id = Number(new URLSearchParams(location.search).get('id'));
    const artigo = document.getElementById('artigo');

    // Conta a visualização uma única vez por acesso (a função ignora ids não publicados).
    if (id) sb.rpc('incrementa_visualizacao', { pub_id: id }).then(() => {});

    async function buscaPub() {
      const data = exigeDados(
        await sb
          .from('publicacoes')
          .select('*, categorias(nome,cor), anexos(id,arquivo,nome_original,mime,tamanho)')
          .eq('id', id)
          .eq('publicado', true)
          .in('campus', CAMPUS_VISIVEIS)
          .maybeSingle()
      );
      if (!data) return { p: null, relacionadas: [] };
      let relacionadas = [];
      if (data.categoria_id) {
        const rel = exigeDados(
          await sb
            .from('publicacoes')
            .select(SEL_PUB)
            .eq('publicado', true)
            .in('campus', CAMPUS_VISIVEIS)
            .eq('categoria_id', data.categoria_id)
            .neq('id', id)
            .order('publicado_em', { ascending: false })
            .limit(4)
        );
        relacionadas = rel ?? [];
      }
      return { p: data, relacionadas };
    }

    function renderPub({ p: bruta, relacionadas }) {
      if (!bruta) {
        artigo.innerHTML = '<p class="vazio">Publicação não encontrada. <a href="/noticias.html">Voltar para as notícias</a></p>';
        return;
      }
      const p = normalizaPublicacao(bruta);
      document.title = `${p.titulo} · ${window.__CPA_PORTAL || 'Portal CPA'}`;
      const cat = p.categoria_nome
        ? `<span class="etiqueta" style="background:${esc(p.categoria_cor || '#1d4ed8')}">${esc(p.categoria_nome)}</span>`
        : '';
      const anexos = p.anexos.length
        ? `<h2 style="font-size:19px;margin-top:32px">Anexos</h2>
           <div class="lista-docs" style="margin-top:12px">
             ${p.anexos
               .map((a) => {
                 const [cls, rot] = classeIcone(a.mime, a.nome_original);
                 return `<div class="doc">
                   <div class="icone ${cls}">${rot}</div>
                   <div class="info"><strong>${esc(a.nome_original)}</strong><span>${fmtTamanho(a.tamanho)}</span></div>
                   <a class="baixar" href="${esc(urlArquivo(a.arquivo, a.nome_original))}" target="_blank" rel="noopener">Baixar</a>
                 </div>`;
               })
               .join('')}
           </div>`
        : '';
      artigo.innerHTML = `
        ${cat}
        <h1>${esc(p.titulo)}</h1>
        <div class="meta">Publicado em ${fmtData(p.publicado_em)} · ${p.visualizacoes + 1} visualização(ões)</div>
        ${p.capa ? `<img class="capa-artigo" src="${esc(urlArquivo(p.capa))}" alt="">` : ''}
        ${p.resumo ? `<p style="font-size:18px;color:var(--cinza)">${esc(p.resumo)}</p>` : ''}
        <div class="conteudo">${mdParaHtml(p.conteudo)}</div>
        ${anexos}`;

      if (relacionadas.length) {
        document.getElementById('sec-relacionadas').style.display = '';
        document.getElementById('relacionadas').innerHTML = relacionadas
          .map((x) => cardPublicacao(normalizaPublicacao(x)))
          .join('');
      } else {
        document.getElementById('sec-relacionadas').style.display = 'none';
      }
    }

    if (id) {
      comCache(`pub:${id}`, buscaPub, renderPub).catch(() => {
        artigo.innerHTML = '<p class="vazio">Não foi possível carregar a publicação. Verifique sua conexão e recarregue a página.</p>';
      });
    } else {
      renderPub({ p: null, relacionadas: [] });
    }
  </script>
</body>
</html>
