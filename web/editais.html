<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editais · Portal CPA</title>
  <link rel="stylesheet" href="/css/portal.css">
  <link rel="preconnect" href="https://nzsjbakghksbuvammgtp.supabase.co" crossorigin>
  <link rel="modulepreload" href="/js/config.js">
  <link rel="modulepreload" href="/js/vendor/supabase-bundle.mjs">
  <link rel="modulepreload" href="/js/db.js">
  <link rel="modulepreload" href="/js/comum.js">
  <link rel="modulepreload" href="/js/editais.js">
  <script>
    // Aplica a marca do campus (descoberta pelo domínio) antes da primeira pintura.
    (function (secao) {
      try {
        var mapa = { 'para.cpaestacio.com.br': 'para', 'belem.cpaestacio.com.br': 'belem' };
        var forcado = new URLSearchParams(location.search).get('campus');
        if (forcado === 'para' || forcado === 'belem') sessionStorage.setItem('campus-forcado', forcado);
        var campus = sessionStorage.getItem('campus-forcado') || mapa[location.hostname] || 'para';
        var nomes = {
          para: ['Portal CPA · Estácio Pará', 'Comissão Própria de Avaliação · Estácio Pará', 'CPA · Estácio Pará'],
          belem: ['Portal CPA · Estácio Belém', 'Comissão Própria de Avaliação · Centro Universitário Estácio Belém', 'CPA · Estácio Belém'],
        }[campus];
        document.documentElement.dataset.campus = campus;
        window.__CPA_SUB = nomes[1];
        window.__CPA_CURTO = nomes[2];
        document.title = secao ? secao + ' · ' + nomes[0] : nomes[0];
      } catch (e) {}
    })('Editais');
  </script>
</head>
<body>
  <header class="topo">
    <div class="container topo-inner">
      <a class="marca" href="/">
        <span class="logo">CPA</span>
        <span class="marca-nome" data-config="subtitulo">Comissão Própria de Avaliação<small>Estácio</small></span>
        <span class="marca-nome-curto">CPA · Estácio</span>
      </a>
      <nav class="menu">
        <a href="/">Início</a>
        <a href="/noticias.html">Notícias</a>
        <a href="/documentos.html">Documentos</a>
        <a href="/editais.html" class="ativo">Editais</a>
        <a href="/quem-somos.html">Quem Somos</a>
        <a id="menu-pesquisa" class="btn-pesquisa" href="#" target="_blank" rel="noopener" style="display:none">Responder Pesquisa</a>
      </nav>
      <div class="menu-mobile">
        <select onchange="if(this.value)location.href=this.value">
          <option value="">Menu</option>
          <option value="/">Início</option>
          <option value="/noticias.html">Notícias</option>
          <option value="/documentos.html">Documentos</option>
          <option value="/editais.html">Editais</option>
          <option value="/quem-somos.html">Quem Somos</option>
        </select>
      </div>
    </div>
  </header>
  <script>if (window.__CPA_SUB) { document.querySelector('.marca-nome').textContent = window.__CPA_SUB; document.querySelector('.marca-nome-curto').textContent = window.__CPA_CURTO; }</script>

  <section class="secao container">
    <div class="secao-cabeca"><h2>Editais</h2></div>
    <p style="color:var(--cinza);margin-bottom:8px">
      Editais da área de Pesquisa, Extensão e Internacionalização e outras oportunidades para os estudantes.
    </p>
    <div id="lista">
      <div class="lista-editais" style="margin-top:24px"><div class="edital-card skeleton" style="min-height:180px"></div><div class="edital-card skeleton" style="min-height:180px"></div></div>
    </div>
  </section>

  <footer class="rodape">
    <div class="container">
      <span data-config="nome_portal">Portal CPA · Estácio</span>
      <a href="/quem-somos.html">Quem Somos</a>
      <a href="/documentos.html">Documentos</a>
      <a id="rodape-contato" href="#" style="display:none"></a>
      <a id="rodape-biblioteca" href="#" style="display:none"></a>
      <a class="admin-link" href="/admin.html">Área administrativa</a>
    </div>
  </footer>

  <script type="module">
    import { sb, pegaConfig, comCache, exigeDados, CAMPUS_VISIVEIS } from '/js/db.js';
    import { aplicaConfig, esc } from '/js/comum.js';
    import { situacaoEdital, ROTULO_SITUACAO, fmtPeriodo } from '/js/editais.js';

    comCache('config', pegaConfig, aplicaConfig);

    const TITULOS_GRUPO = { aberto: 'Inscrições abertas', em_breve: 'Em breve', encerrado: 'Encerrados' };

    async function busca() {
      const data = exigeDados(
        await sb
          .from('editais')
          .select('id,area,numero,titulo,resumo,inicio,fim')
          .eq('publicado', true)
          .in('campus', CAMPUS_VISIVEIS)
          .order('fim', { ascending: false, nullsFirst: true })
      );
      return data ?? [];
    }

    function card(e) {
      const sit = situacaoEdital(e);
      return `
        <article class="edital-card">
          <div class="edital-area">${esc(e.area)}</div>
          <h4><a href="/edital?id=${e.id}">${esc(e.titulo)}</a></h4>
          <div class="edital-meta">${e.numero ? `${esc(e.numero)} · ` : ''}Inscrições: ${esc(fmtPeriodo(e))}</div>
          ${e.resumo ? `<p class="edital-resumo">${esc(e.resumo)}</p>` : ''}
          <div><span class="situacao ${sit}">${ROTULO_SITUACAO[sit]}</span></div>
          <a class="btn-edital${sit === 'aberto' ? '' : ' secundario'}" href="/edital?id=${e.id}">${sit === 'aberto' ? 'Inscreva-se' : 'Ver edital'}</a>
        </article>`;
    }

    function render(lista) {
      // A situação é recalculada a cada renderização, então o cache não fica desatualizado.
      const grupos = { aberto: [], em_breve: [], encerrado: [] };
      for (const e of lista) grupos[situacaoEdital(e)].push(e);
      const html = Object.entries(grupos)
        .filter(([, itens]) => itens.length)
        .map(([chave, itens]) => `
          <div class="editais-grupo">
            <h3>${TITULOS_GRUPO[chave]}</h3>
            <div class="lista-editais">${itens.map(card).join('')}</div>
          </div>`)
        .join('');
      document.getElementById('lista').innerHTML = html || '<p class="vazio">Nenhum edital publicado no momento.</p>';
    }

    comCache('editais', busca, render).catch(() => {
      document.getElementById('lista').innerHTML = '<p class="vazio">Não foi possível carregar os editais agora. Tente novamente em instantes.</p>';
    });
  </script>
</body>
</html>
